<body>

    <div id="header">
        <h1>Petcare</h1>

    <div id="menu">
        <ul>
            <li><a href="home.html">voltar a pagina inicial</a></li><br>

    <div id="main">
        <h2>Página de login!</h2>
        <p>Aqui você pode fazer login ou se cadastrar para melhor experiência.</p>

        <div id="container">


        <form action="home.html" method="get">

            <label>Nome completo:</label>
            <input type="text" name="nome" placeholder="Digite seu nome" required> <br>

            <label>E-mail:</label>
            <input type="email" name="email" placeholder="Digite seu e-mail" required> <br>

            <label>Telefone:</label>
            <input type="tel" name="telefone" placeholder="Digite seu telefone" required> <br>

            <label>Senha:</label>
            <input type="password" name="senha" placeholder="Crie uma senha" required> <br>

            <button type="submit">Cadastrar</button><br>

        </form>

        <p>Após o login/cadastro você será redirecionado para a página inicial.</p>

    </div>





    </div>

    <div id="footer">
        <p>Rodapé da Página</p>
    </div>
